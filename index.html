<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Juice Mall - 100% Raw, Cold-Pressed, Organic Juices and Smoothies crafted fresh daily. Experience vibrant wellness delivered to your doorstep." />
    <meta name="theme-color" content="#FF6B35" />
    <title>Juice Mall | 100% Raw & Cold-Pressed Fresh Juices</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Dark Mode Anti-FOUC script -->
    <script>
      (function() {
        try {
          const savedTheme = localStorage.getItem('juicemall_theme');
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
            document.documentElement.classList.add('dark');
            document.querySelector('meta[name="color-scheme"]').content = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.querySelector('meta[name="color-scheme"]').content = 'light';
          }
        } catch (e) {
          // ignore error
        }
      })();
    </script>
  </head>
  <body class="bg-[#FFFDF9] text-stone-800 dark:bg-[#0F172A] dark:text-stone-100 font-sans transition-colors duration-300 antialiased selection:bg-orange-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
