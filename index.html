<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Discover the Juice Mall collection: thoughtfully crafted, cold-pressed juices, seasonal blends, and fresh flavors from the orchard." />
    <meta name="theme-color" content="#263d33" />
    <title>THE GRAND JUICE MALL — Luxury Cold-Pressed Juices</title>
    
    <!-- Google Fonts: Cinzel, Playfair Display, Outfit, Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800;900&family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;0,900;1,600;1,700&family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Dark Mode Anti-FOUC script -->
    <script>
      (function() {
        try {
          const savedTheme = localStorage.getItem('juicemall_theme');
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
            document.documentElement.classList.add('dark');
            document.querySelector('meta[name="color-scheme"]').content = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.querySelector('meta[name="color-scheme"]').content = 'light';
          }
        } catch (e) {
          // ignore error
        }
      })();
    </script>
  </head>
  <body class="bg-[#07090E] text-stone-100 font-sans antialiased selection:bg-amber-500 selection:text-black" style="background:#07090E;color:#e7e5e4">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
